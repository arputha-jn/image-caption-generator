<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Caption Generator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        h2 { color: #1e293b; margin-top: 0; margin-bottom: 20px; }
        input[type="file"] { margin-bottom: 15px; width: 100%; }
        .preview-box { width: 100%; height: 180px; background: #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; color: #64748b; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #4f46e5; }
        #captionResult { margin-top: 15px; font-weight: 600; color: #0f172a; font-size: 1rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Caption Generator</h2>
    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    <div class="preview-box">
        <span id="placeholderText">No Image Selected</span>
        <img id="imagePreview" alt="Preview">
    </div>
    <button onclick="generateCaption()">Generate Caption</button>
    <div id="captionResult"></div>
</div>

<script>
    function previewImage(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('imagePreview');
        const placeholder = document.getElementById('placeholderText');
        
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            placeholder.style.display = 'none';
        }
    }

    function generateCaption() {
        const fileInput = document.getElementById('imageInput');
        const result = document.getElementById('captionResult');
        
        if (!fileInput.files[0]) {
            result.textContent = 'Please upload an image first!';
            result.style.color = '#ef4444';
            return;
        }

        const sampleCaptions = [
            "A scenic view captured in bright daylight.",
            "An expressive photo highlighting details and textures.",
            "A beautiful composition full of vibrant energy.",
            "A clean shot showcasing distinct elements."
        ];
        const randomCaption = sampleCaptions[Math.floor(Math.random() * sampleCaptions.length)];
        
        result.style.color = '#10b981';
        result.textContent = `Caption: "${randomCaption}"`;
    }
</script>

</body>
</html>
